[build-system]
requires = ["uv_build>=0.7.19"]
build-backend = "uv_build"

[project]
name = "bridge-to-bridge-api"
version = "0.1.0"
description = "FastAPI backend for Bridge to Bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "fastapi[standard]>=0.111.0",
    "httpx>=0.27.0",
    "python-keycloak>=4.0.0",
    "pydantic-settings>=2.2.1",
    "psycopg[binary]>=3.1.18",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "PyJWT>=2.8.0",
]

[project.scripts]
bridge-to-bridge-api = "bridge_to_bridge_api.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.30.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]



[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC",
]
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Alembic's env.py must set up sys.path/config before importing the models, and
# imports them only to register their tables on Base.metadata.
"alembic/env.py" = ["E402", "F401"]
# conftest sets environment variables before the app is imported.
"tests/conftest.py" = ["E402"]

[tool.bridge_to_bridge_api]
log_level = "DEBUG"
