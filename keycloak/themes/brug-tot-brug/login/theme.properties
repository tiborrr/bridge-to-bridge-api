# Brug tot Brug end-user login theme (bridge-realm).
# Extends the stock keycloak.v2 theme: only CSS, images and messages are
# overridden, no templates, so Keycloak upgrades keep working unchanged.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's own stylesheet first, then the brand layer on top.
styles=css/styles.css css/brug-tot-brug.css

# One fixed, recognisable look instead of following the OS dark mode.
darkMode=false
